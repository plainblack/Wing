# config-file-type: JSON 1
{
   "api_key_permissions" : [
      "view_my_account",
      "edit_my_account"
   ],
   "app_namespace" : "TestWing",
   "cache" : {
      "cache_size" : "1M",
      "driver" : "FastMmap",
      "serializer" : "JSON"
   },
   "db" : [
      "DBI:mysql:database=testwing",
      "testwing",
      "testwing",
      {
         "mysql_enable_utf8" : 1
      },
      {
         "quote_names" : 1
      }
   ],
   "rpc_limit" : 30,
   "sitename" : "localhost",
   "tenants" : {
      "db_driver" : {
         "prefix" : "DBI:mysql:database=",
         "suffix" : ""
      },
      "domain" : "localdomain",
      "namespace" : "Acquisitions"
   },
   "wingman" : {
      "beanstalkd" : {
         "default_tube" : "wingman_test",
         "server" : "127.0.0.1",
         "ttr" : 60
      },
      "max_workers" : 2,
      "plugins" : {
         "TestWing::Wingman::EchoJson" : {
            "phase" : "EchoJson"
         },
         "TestWing::Wingman::HelloWorld" : {
            "phase" : "howdy"
         }
      }
   }
}
